name: CI

on:
  push:
  pull_request:

# Determinism claim (docs/determinism.md; docs/research_plan.md §5 items 9 and
# 13): the committed trace hashes are reproduced bit for bit on the same
# platform, which the exact-hash gates in the Ubuntu job check. Across
# platforms only agreement within a stated tolerance is claimed (1e-9 absolute
# on floats, exact otherwise); the macOS job deselects the exact-hash gates
# (every test marked ``exact_hash``, pytest.ini; the marker is required on every
# test that reads a committed hash file, which
# tests/determinism/test_exact_hash_marker.py checks) and runs the tolerance
# gate, tests/determinism/test_cross_platform_tolerance.py, against the
# committed reference traces.
jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[console,dev]"
      - name: Run tests (Ubuntu, full suite including the bit-identity gates)
        if: runner.os == 'Linux'
        run: python -m pytest -q
      - name: Run tests (macOS, full suite minus the exact-hash gates)
        if: runner.os == 'macOS'
        # Same-platform bit identity is the Ubuntu job's claim; the exact_hash
        # tests compare against hashes recorded on Linux and are not claimed
        # here. The marker, not a file list, so a new gate cannot be missed.
        run: python -m pytest -q -m "not exact_hash"
      - name: Cross-platform tolerance gate (macOS)
        if: runner.os == 'macOS'
        # The cross-platform claim: each profile's 200-tick trace agrees with
        # the committed reference trace within tolerance (docs/determinism.md).
        run: python -m pytest -q tests/determinism/test_cross_platform_tolerance.py
